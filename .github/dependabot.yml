version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]

    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-patch"]
