name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions: {}

jobs:
    plan:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            mode: ${{ steps.plan.outputs.mode }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - uses: changesets/action/select-mode@v2
              id: plan
            - uses: changesets/action/version@v2
              if: steps.plan.outputs.mode == 'version'
              with:
                  script: bun run version:packages

    publish:
        needs: plan
        if: needs.plan.outputs.mode == 'publish'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  package-manager-cache: false
            - uses: oven-sh/setup-bun@v2
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown
            - uses: taiki-e/install-action@v2
              with:
                  tool: wasm-pack@0.15.1
            - run: bun install --frozen-lockfile
            - run: bun run build --filter='./packages/*'
            - name: Select npm dist-tag
              id: channel
              # Changesets can default to latest when npm only has prereleases.
              run: |
                  tag=$(node -p 'require("./packages/csx/package.json").version.split("-")[1]?.split(".")[0] ?? "latest"')
                  printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
            - uses: changesets/action/publish@v2
              with:
                  script: bun run changeset publish --tag ${{ steps.channel.outputs.tag }}
